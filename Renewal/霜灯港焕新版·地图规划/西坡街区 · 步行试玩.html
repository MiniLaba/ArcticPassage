 if(b.id==='glass'){if(state.bread&&state.mail){state.garden=true;say(b.name,'种子已分进公用苗盘。值班人分开面包，把你的名字挂上今日菜床牌。')}else say(b.name,'菜床已经备好。还需要'+[!state.mail?'邮局的种子信':'',!state.bread?'石炉面包房的面包篮':''].filter(Boolean).join('和')+'。')}
 if(b.id==='weave'){if(state.printed)say(b.name,'这张样纸已经套印，可以送去小院展售廊。');else{say(b.name,'织工摊开两组线头。选一组做今天的版画配色。');for(const color of ['峡湾蓝与赭黄','砖红与苔绿']){let button=document.createElement('button');button.textContent=color;button.onclick=()=>{state.color=color;say(b.name,'收好「'+color+'」色签。下一站是隔壁的版画室。');status()};$('decide').append(button)}}}
 if(b.id==='press'){if(state.color){state.printed=true;say(b.name,'滚筒压过纸面。「'+state.color+'」的港湾版画晾好了，可以送去展售廊。')}else say(b.name,'印台已经上纸。先到背风织造坊挑一张色签。')}
 if(b.id==='gallery'){if(state.printed){state.shown=true;say(b.name,'「'+state.color+'」挂上街窗，海湾版画展今天开张。')}else say(b.name,'木框正空着。先去织造坊挑颜色，再到版画室套印。')}status()}
function draw(){const [x,y]=at(pos);$('person').setAttribute('transform','translate('+(x*10+5)+' '+(y*10+5)+')');
 if(overview)svg.setAttribute('viewBox','0 0 1020 560');else{let width=385,height=235;let left=Math.max(0,Math.min(1020-width,x*10-width/2)),top=Math.max(0,Math.min(560-height,y*10-height/2));svg.setAttribute('viewBox',[left,top,width,height].join(' '))}
 $('trail').setAttribute('d',route.length?'M'+[pos,...route].map(i=>at(i).map(v=>v*10+5).join(' ')).join('L'):'')}
function go(to,building=null){const r=path(pos,to);if(r===null){$('feedback').textContent='这里不能落脚。可点浅色街道或建筑屋顶。';return}route=r;goal=building;$('feedback').textContent=building?'前往'+building.name:'';if(!r.length&&goal){act(goal);goal=null}draw()}
svg.addEventListener('click',e=>{let roof=e.target.closest('[data-site]');if(roof){const b=byId[roof.dataset.site];go(idx(...b.door),b);return}
 const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());const x=Math.floor(pt.x/10),y=Math.floor(pt.y/10);if(allowed(x,y))go(idx(x,y));else $('feedback').textContent='水面、房屋和岩壁不可穿过。'});
function step(dx,dy){route=[];goal=null;const [x,y]=at(pos);if(allowed(x+dx,y+dy))pos=idx(x+dx,y+dy);draw()}
const keys={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowDown:[0,1],ArrowUp:[0,-1],a:[-1,0],d:[1,0],s:[0,1],w:[0,-1]};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;let k=e.key.length===1?e.key.toLowerCase():e.key;if(keys[k]){e.preventDefault();if(held!==k){held=k;step(...keys[k]);lastMove=performance.now()}}else if(k==='e'&&!e.repeat){act()}});
document.addEventListener('keyup',e=>{if((e.key.length===1?e.key.toLowerCase():e.key)===held)held=null});window.addEventListener('blur',()=>held=null);
$('zoom').onclick=()=>{overview=!overview;$('zoom').textContent=overview?'跟随行走':'街区全图';draw()};$('action').onclick=()=>act();document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>step(...b.dataset.d.split(',').map(Number)));
for(const key of ['post','bake','glass','weave','press','gallery','chapel']){const b=byId[key],bt=document.createElement('button');bt.textContent=b.name;bt.onclick=()=>go(idx(...b.door),b);$('dest').append(bt)}
const locals=[['post','bake'],['weave','gallery'],['clinic','school']].map(([a,b])=>{let first=idx(...byId[a].door),line=path(first,idx(...byId[b].door)),node=document.createElementNS('http://www.w3.org/2000/svg','g');
 node.innerHTML='<ellipse cy="1.8" rx="3" ry="1.3" fill="#58675c" opacity=".45"/><rect x="-2.7" y="-4.6" width="5.4" height="5.5" rx="1" fill="#446d83"/><circle cy="-6.1" r="1.8" fill="#e0b486"/>';$('people').append(node);return {node,path:[first,...line,...line.slice(0,-1).reverse()],first}});
function tick(t){if(held&&t-lastMove>110){step(...keys[held]);lastMove=t}else if(route.length&&t-walkTime>64){pos=route.shift();walkTime=t;draw();if(!route.length&&goal){act(goal);goal=null;$('feedback').textContent='已到门前'}}
 for(const [n,r] of locals.entries()){const j=Math.floor(t/510+n*8)%(r.path.length+6),[x,y]=at(r.path[Math.min(j,r.path.length-1)]);r.node.setAttribute('transform','translate('+(x*10+6)+' '+(y*10+6)+')')}requestAnimationFrame(tick)}
status();draw();requestAnimationFrame(tick);
</script></html>
